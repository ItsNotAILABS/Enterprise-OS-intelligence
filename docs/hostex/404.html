<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>404 — HOSTEX</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#03020a;color:#c8c0d8;font-family:'Courier New',monospace;display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center;padding:20px}
.container{max-width:500px}
.code{font-size:6rem;font-weight:bold;background:linear-gradient(135deg,#ff9500,#cc6600);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:16px}
.message{font-size:1.1rem;color:#776655;margin-bottom:24px}
.sub{font-size:.82rem;color:#443322;margin-bottom:32px;line-height:1.7}
.btn{display:inline-block;background:#ff9500;color:#000;padding:12px 28px;border-radius:4px;font-family:'Courier New',monospace;font-size:.85rem;font-weight:bold;letter-spacing:.06em;text-decoration:none}
.btn:hover{box-shadow:0 0 24px #ff950055}
</style>
</head>
<body>
<div class="container">
  <div class="code">404</div>
  <div class="message">DNS Record Not Found</div>
  <div class="sub">The requested resource does not exist in this zone.<br>Lyapunov stability check: NXDOMAIN detected.</div>
  <a href="./" class="btn">← Return to HOSTEX Dashboard</a>
</div>
</body>
</html>
