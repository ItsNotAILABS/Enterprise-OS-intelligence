name: "Release Packages — Build & Publish SDK Archives"

# ─────────────────────────────────────────────────────────────────────────────
# GUBERNATIO VIVA — Release Packaging Pipeline
#
# Builds distributable zip archives for all publishable SDKs and production
# apps, generates SHA-256 checksums, and attaches them to a GitHub Release.
#
# Trigger:
#   - Push a tag matching `release-v*` (e.g. release-v1.1.0)
#   - Manual workflow_dispatch with a version input
#
# Output:
#   - GitHub Release with zip archives of each package
#   - CHECKSUMS.sha256 manifest for integrity verification
#
# VIVIT · MEMINIT · GUBERNAT
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    tags:
      - 'release-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.1.0)'
        required: true
        type: string
      dry_run:
        description: 'Dry run — build packages but do not publish release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-packages:
    name: "Build Release Packages"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: "Determine version"
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            # Extract version from tag: release-v1.1.0 -> 1.1.0
            VERSION="${GITHUB_REF_NAME#release-v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=release-v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Release version: $VERSION"

      - name: "Build SDK packages"
        id: build
        run: |
          mkdir -p dist/packages

          # Define packages to release (SDKs with package.json)
          PACKAGES=(
            "sdk/effecttrace-governance-organism"
            "sdk/student-ai"
            "sdk/analyst-ai"
            "sdk/paralegal-ai"
            "sdk/worker-ai"
            "sdk/builder-ai"
            "sdk/tool-ai"
            "sdk/organism-ai"
            "sdk/birth-ai"
            "sdk/meridian-sovereign-os"
            "sdk/silver-canister"
            "sdk/bronze-canister"
            "sdk/gold-canister"
            "sdk/enterprise-integration-sdk"
            "sdk/sovereign-memory-sdk"
            "sdk/intelligence-routing-sdk"
            "sdk/organism-runtime-sdk"
            "sdk/document-absorption-engine"
            "sdk/sovereign-protocol-sdk"
            "sdk/blockchain-operations-engine"
            "sdk/backend-orchestration-engine"
            "sdk/edge-coordination-engine"
            "sdk/agent-runtime-mesh-sdk"
            "sdk/virtual-chip-packager"
          )

          BUILT=0
          for pkg_dir in "${PACKAGES[@]}"; do
            if [ -d "$pkg_dir" ] && [ -f "$pkg_dir/package.json" ]; then
              PKG_NAME=$(node -p "require('./$pkg_dir/package.json').name" 2>/dev/null || echo "")
              PKG_VERSION=$(node -p "require('./$pkg_dir/package.json').version" 2>/dev/null || echo "")

              if [ -n "$PKG_NAME" ]; then
                # Create clean package name for zip file
                CLEAN_NAME=$(echo "$PKG_NAME" | sed 's/@medina\///' | sed 's/\//-/g')
                ZIP_NAME="${CLEAN_NAME}-v${PKG_VERSION}.zip"

                echo "  📦 Packaging $PKG_NAME@$PKG_VERSION -> $ZIP_NAME"
                (cd "$pkg_dir" && zip -r "../../dist/packages/$ZIP_NAME" . -x '*/node_modules/*' -x '*/.git/*')
                BUILT=$((BUILT + 1))
              fi
            fi
          done

          # Package production apps
          if [ -d "production-apps" ]; then
            ZIP_NAME="production-apps-v${{ steps.version.outputs.version }}.zip"
            echo "  📦 Packaging production-apps -> $ZIP_NAME"
            (cd production-apps && zip -r "../dist/packages/$ZIP_NAME" . -x '*/node_modules/*')
            BUILT=$((BUILT + 1))
          fi

          echo "packages_built=$BUILT" >> "$GITHUB_OUTPUT"
          echo ""
          echo "✅ Built $BUILT packages"

      - name: "Generate checksums"
        working-directory: dist/packages
        run: |
          sha256sum *.zip > CHECKSUMS.sha256
          echo "Generated checksums:"
          cat CHECKSUMS.sha256

      - name: "Upload build artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: release-packages-${{ steps.version.outputs.version }}
          path: dist/packages/
          retention-days: 30

      - name: "Create GitHub Release"
        if: github.event.inputs.dry_run != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Enterprise OS Intelligence ${{ steps.version.outputs.version }}"
          body: |
            ## Enterprise OS Intelligence — Release ${{ steps.version.outputs.version }}

            **Gubernatio Viva — VIVIT · MEMINIT · GUBERNAT**

            ### Packages (${{ steps.build.outputs.packages_built }} archives)

            All SDK packages are bundled as zip archives below. Each archive contains the
            full source for that package ready for `npm install` or direct integration.

            ### Verification

            Download `CHECKSUMS.sha256` and verify any package:
            ```bash
            sha256sum -c CHECKSUMS.sha256
            ```

            ### SDK Portfolio
            | Category | Packages |
            |----------|----------|
            | Core Intelligence | effecttrace-governance-organism, meridian-sovereign-os |
            | AI Agents | student-ai, analyst-ai, paralegal-ai, worker-ai, builder-ai, tool-ai, organism-ai, birth-ai |
            | Infrastructure | sovereign-protocol-sdk, blockchain-operations-engine, backend-orchestration-engine |
            | Canisters | bronze-canister, silver-canister, gold-canister |
            | Enterprise | enterprise-integration-sdk, intelligence-routing-sdk, sovereign-memory-sdk |
            | Production Apps | 10 enterprise intelligence applications |

            ---
            *Alfredo Medina Hernandez · Medina Tech · Chaos Lab · Dallas, Texas*
          files: |
            dist/packages/*.zip
            dist/packages/CHECKSUMS.sha256
          draft: false
          prerelease: false

      - name: "Publish release summary"
        run: |
          echo "### Release Packages — v${{ steps.version.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Metric | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Packages built | ${{ steps.build.outputs.packages_built }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Version | ${{ steps.version.outputs.version }} |" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ github.event.inputs.dry_run }}" == "true" ]; then
            echo "| Mode | 🔍 Dry run — no release published |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| Mode | ✅ Published to GitHub Releases |" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "*Gubernatio Viva — VIVIT · MEMINIT · GUBERNAT*" >> "$GITHUB_STEP_SUMMARY"
