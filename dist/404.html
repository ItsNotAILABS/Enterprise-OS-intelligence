<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Medina Tech Labs</title>
  <style>
    :root {
      --cyan: #00d4ff;
      --purple: #a855f7;
      --bg: #030014;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: var(--bg);
      color: #fff;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      overflow: hidden;
    }
    .bg-glow {
      position: fixed;
      width: 500px; height: 500px;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.3;
      pointer-events: none;
    }
    .glow-1 { background: var(--cyan); top: -200px; left: -100px; }
    .glow-2 { background: var(--purple); bottom: -200px; right: -100px; }
    .code {
      font-size: 8rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--cyan), var(--purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 1rem;
      line-height: 1;
    }
    h1 {
      font-size: 1.75rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
    }
    p {
      color: #64748b;
      margin-bottom: 2.5rem;
      max-width: 400px;
      line-height: 1.6;
    }
    a {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: #fff;
      text-decoration: none;
      padding: 0.9rem 2rem;
      background: linear-gradient(135deg, var(--cyan), var(--purple));
      border-radius: 12px;
      font-weight: 600;
      transition: transform 0.2s, box-shadow 0.3s;
    }
    a:hover {
      transform: translateY(-3px);
      box-shadow: 0 0 40px rgba(0,212,255,0.3);
    }
    .footer {
      position: absolute;
      bottom: 2rem;
      font-size: 0.75rem;
      color: #334155;
    }
  </style>
</head>
<body>
  <div class="bg-glow glow-1"></div>
  <div class="bg-glow glow-2"></div>
  <div class="code">404</div>
  <h1>Module Not Found</h1>
  <p>The intelligence module you're looking for doesn't exist at this coordinates. It may have been relocated or decommissioned.</p>
  <a href="/">← Return to Platform</a>
  <div class="footer">
    © 2026 Medina Tech Labs · medinatechlabs.net
  </div>
</body>
</html>
